name: Build App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64

      # Add commands here if your other 2 files are generated by other build steps
      # e.g., flutter build appbundle --release, or custom build scripts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            path/to/your/second-file.ext
            path/to/your/third-file.ext
