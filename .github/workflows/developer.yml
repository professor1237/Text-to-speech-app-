name: Build and Update Developer Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "Signing secrets are missing. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Update Developer Tag
        run: |
          git tag -f developer "$GITHUB_SHA"
          git push --force origin refs/tags/developer

      - name: Update Developer Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer
          name: Developer Build
          body: |
            # Developer Version

            Automatically updated from the latest main branch.

            Commit: ${{ github.sha }}

            This is a testing release.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          fail_on_unmatched_files: true
