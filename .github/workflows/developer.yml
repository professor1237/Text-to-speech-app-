name: Build and Recreate Developer Release

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "Signing secrets are missing. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "APK successfully generated:"
          ls -lh "$APK"

      # Do not remove the working release until a new APK has built and passed verification.
      - name: Delete Previous Developer Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view developer >/dev/null 2>&1; then
            gh release delete developer --yes
          else
            echo "No previous developer release found."
          fi

      - name: Replace Developer Tag
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          git push origin --delete developer || true
          git tag -f developer "$BUILD_SHA"
          git push origin refs/tags/developer

      - name: Create New Developer Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer
          name: Developer Build
          body: |
            # Developer Version

            Fresh developer release created after a successful Flutter build.

            Commit: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

            This is a testing release.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
