name: Build and Recreate Developer Release

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Newer release runs cancel older ones. The newest successful main CI run wins.
concurrency:
  group: developer-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish Latest Developer Release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "Signing secrets are missing. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      # Recheck after the long build so an outdated APK is never published.
      - name: Confirm commit is still latest before replacing release
        id: latest_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_MAIN_SHA="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          if [ "$LATEST_MAIN_SHA" != "$BUILD_SHA" ]; then
            echo "A newer main commit arrived during the build; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove previous Developer Release and tag
        if: steps.latest_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view developer >/dev/null 2>&1; then
            gh release delete developer --yes
          fi
          git push origin --delete developer || true

      - name: Create developer tag for this exact commit
        if: steps.latest_check.outputs.publish == 'true'
        run: |
          git tag -f developer "$BUILD_SHA"
          git push origin refs/tags/developer

      # GitHub generates Source code (zip) and Source code (tar.gz) from this tag.
      # The draft remains unpublished until the APK has uploaded successfully.
      - name: Create draft Developer Release and upload APK
        if: steps.latest_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer
          name: Developer Build
          draft: true
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          body: |
            # Developer Version

            Latest successful main-branch build.

            Commit: ${{ env.BUILD_SHA }}

            Downloads:
            - app-release.apk
            - Source code (zip), generated by GitHub from this tag
            - Source code (tar.gz), generated by GitHub from this tag

      - name: Publish complete Developer Release
        if: steps.latest_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the release by its tag through GitHub CLI. The releases
          # collection can omit a just-created draft due to API consistency
          # timing, which previously produced a false 404 at publish time.
          RELEASE_ID="$(gh release view developer --json databaseId --jq .databaseId)"
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve the developer release ID for tag 'developer'."
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "Published APK and GitHub-generated source archives for $BUILD_SHA."
