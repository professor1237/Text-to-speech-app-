name: Fix Scaffold Issues

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── 1. Snapshot the files we want to keep as-is ─────────
      - name: Backup custom files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/lib 2>/dev/null || true
          cp pubspec.yaml /tmp/backup/ 2>/dev/null || true
          cp README.md /tmp/backup/ 2>/dev/null || true

      # ── 2. Regenerate any missing platform files ────────────
      - name: Regenerate platform folders (idempotent)
        run: |
          flutter create --platforms=android,ios --project-name t2s_reader . || true

      # ── 3. Restore custom files (so create didn't clobber) ──
      - name: Restore custom files
        run: |
          rm -rf lib && cp -r /tmp/backup/lib ./lib
          cp /tmp/backup/pubspec.yaml ./
          if [ -f /tmp/backup/README.md ]; then cp /tmp/backup/README.md ./; fi

      # ── 4. Fix the broken widget test ───────────────────────
      - name: Replace broken widget test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'TESTEOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:t2s_reader/main.dart';

          void main() {
            testWidgets('App boots without crashing', (tester) async {
              await tester.pumpWidget(const T2SApp());
              expect(find.text('T2S Reader'), findsOneWidget);
              // sqflite has no platform channel in widget tests — let it fail
              // quietly rather than abort the test.
              await tester.pump(const Duration(milliseconds: 200));
              tester.takeException();
            });
          }
          TESTEOF

      # ── 5. Force minSdk 21 for flutter_tts ──────────────────
      - name: Ensure minSdk 21
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          fi

      # ── 6. Remove leftover scaffold workflow ────────────────
      - name: Delete old scaffold workflow if present
        run: |
          rm -f .github/workflows/scaffold.yml

      # ── 7. Report what we found / did ───────────────────────
      - name: Report
        run: |
          echo "===== widget_test.dart ====="
          cat test/widget_test.dart
          echo ""
          echo "===== minSdk lines ====="
          grep -rn "minSdk" android/app/ 2>/dev/null || echo "(no minSdk line — flutter default applies)"
          echo ""
          echo "===== Android build files ====="
          ls android/build.gradle* android/settings.gradle* android/app/build.gradle* 2>/dev/null || echo "MISSING — flutter create should have made them"
          echo ""
          echo "===== iOS build files ====="
          ls ios/Runner/Info.plist ios/Podfile 2>/dev/null || echo "MISSING — flutter create should have made them"

      # ── 8. Commit + push ────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change — repo was already correct."
          else
            git commit -m "Auto-fix: widget test, minSdk, regenerate missing platform files"
            git push
          fi
