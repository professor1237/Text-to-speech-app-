name: Make signing key (run once)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create key
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "KEYSTORE_PASSWORD secret is missing"
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=T2S Reader"
          base64 -w 0 release.jks > keystore.b64.txt

      - name: Upload key text
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore.b64.txt
          retention-days: 1
