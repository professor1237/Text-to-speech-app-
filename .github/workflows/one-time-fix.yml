name: One-Time Flutter Bug Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inspect and fix the entire project
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are a senior Flutter and Dart engineer.

            Work directly in this repository.

            OBJECTIVE:
            Thoroughly inspect the entire Flutter application,
            identify bugs, and implement fixes.

            REQUIREMENTS:

            1. Inspect every Dart source file, widget, screen,
               model, service, database operation and test.

            2. Find and fix all reproducible bugs, including:
               - Runtime crashes
               - Incorrect application logic
               - Async and lifecycle problems
               - Memory leaks and undisposed controllers
               - Invalid input handling
               - EPUB parsing and reading problems
               - Text-to-speech playback problems
               - Sentence splitting problems
               - Database and file management problems
               - Navigation and UI problems
               - Error handling problems
               - Missing or incorrect tests

            3. Do not assume a suspected issue is a real bug.
               Verify it against the actual code.

            4. Fix the existing widget tests and add useful
               regression tests for bugs you discover.

            5. Preserve the existing application functionality
               and design wherever possible.

            6. Do not perform unnecessary rewrites or remove
               working features.

            7. Format the Dart code.

            8. Run:
               flutter analyze
               flutter test

            9. Fix issues revealed by those commands.

            10. Review your final changes for regressions.

            Do not commit anything yourself.
            Do not delete this workflow file.
            Do not claim success if tests fail.

      - name: Format Dart code
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Check patch formatting
        run: git diff --check

      - name: Commit application fixes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/one-time-fix.yml

          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 1
          fi

          git commit -m "fix: resolve Flutter application bugs"
          git push origin main

      - name: Delete temporary workflow
        run: |
          git rm .github/workflows/one-time-fix.yml
          git commit -m "chore: remove temporary bug-fix workflow"
          git push origin main
