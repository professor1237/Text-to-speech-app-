name: Release to Developer

on:
  workflow_run:
    workflows: ["Build App"]
    types:
      - completed
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if the build workflow succeeded (or if triggered manually)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      # Download the files uploaded by the build workflow
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update Developer Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer
          name: Developer Build
          files: |
            app-release.apk
            second-file.ext
            third-file.ext
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
