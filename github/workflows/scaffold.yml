name: Scaffold T2S Reader

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  scaffold:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-scaffold]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform folders
        run: |
          flutter create --platforms=android,ios --org com.example --project-name t2s_reader . || true

      - name: Write app source files
        run: |
          mkdir -p lib/models lib/services lib/screens lib/widgets

          cat > pubspec.yaml <<'PUBSPEC_EOF'
          name: t2s_reader
          description: Text-to-speech EPUB reader with system voice, term replacement, scroll reading.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_tts: ^4.2.0
            epubx: ^4.0.0
            html: ^0.15.4
            file_picker: ^8.0.0
            path_provider: ^2.1.4
            sqflite: ^2.3.3
            path: ^1.9.0
            shared_preferences: ^2.3.0

          flutter:
            uses-material-design: true
          PUBSPEC_EOF

          cat > lib/main.dart <<'MAIN_EOF'
          import 'package:flutter/material.dart';
          import 'screens/library_screen.dart';

          void main() => runApp(const T2SApp());

          class T2SApp extends StatelessWidget {
            const T2SApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'T2S Reader',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(colorSchemeSeed: Colors.indigo, useMaterial3: true),
                home: const LibraryScreen(),
              );
            }
          }
          MAIN_EOF

          cat > lib/models/block.dart <<'BLOCK_EOF'
          enum BlockType { paragraph, heading, listItem, quote }

          class Block {
            final String text;
            final BlockType type;
            const Block(this.text, this.type);
          }
          BLOCK_EOF

          cat > lib/models/sentence.dart <<'SENT_EOF'
          class Sentence {
            final String text;
            final int start;
            final int end;
            const Sentence(this.text, this.start, this.end);
          }

          const _enders = '.!?\u2026\u3002\uFF01\uFF1F';
          const _closers = '"\'\u201D\u2019)]';

          List<Sentence> splitSentences(String text) {
            final out = <Sentence>[];
            int start = 0;
            for (int i = 0; i < text.length; i++) {
              if (!_enders.contains(text[i])) continue;
              int j = i + 1;
              while (j < text.length && _closers.contains(text[j])) {
                j++;
              }
              final chunk = text.substring(start, j);
              if (chunk.trim().isNotEmpty) out.add(Sentence(chunk, start, j));
              start = j;
              i = j - 1;
            }
            if (start < text.length) {
              final chunk = text.substring(start);
              if (chunk.trim().isNotEmpty) out.add(Sentence(chunk, start, text.length));
            }
            return out;
          }
          SENT_EOF

          cat > lib/models/term_rule.dart <<'RULE_EOF'
          import 'dart:convert';

          class TermRule {
            final String find;
            final String replace;
            final bool regex;
            final bool caseSensitive;
            final bool enabled;

            const TermRule({
              required this.find,
              required this.replace,
              this.regex = false,
              this.caseSensitive = true,
              this.enabled = true,
            });

            TermRule copyWith({
              String? find,
              String? replace,
              bool? regex,
              bool? caseSensitive,
              bool? enabled,
            }) =>
                TermRule(
                  find: find ?? this.find,
                  replace: replace ?? this.replace,
                  regex: regex ?? this.regex,
                  caseSensitive: caseSensitive ?? this.caseSensitive,
                  enabled: enabled ?? this.enabled,
                );

            Map<String, dynamic> toJson() => {
                  'find': find,
                  'replace': replace,
                  'regex': regex,
                  'caseSensitive': caseSensitive,
                  'enabled': enabled,
                };

            factory TermRule.fromJson(Map<String, dynamic> j) => TermRule(
                  find: j['find'] ?? '',
                  replace: j['replace'] ?? '',
                  regex: j['regex'] ?? false,
                  caseSensitive: j['caseSensitive'] ?? true,
                  enabled: j['enabled'] ?? true,
                );
          }

          String applyTermRules(String input, List<TermRule> rules) {
            var out = input;
            for (final r in rules) {
              if (!r.enabled || r.find.isEmpty) continue;
              final pattern = r.regex
                  ? RegExp(r.find, caseSensitive: r.caseSensitive)
                  : RegExp(RegExp.escape(r.find), caseSensitive: r.caseSensitive);
              out = out.replaceAll(pattern, r.replace);
            }
            return out;
          }

          List<TermRule> decodeRules(String? raw) {
            if (raw == null || raw.isEmpty) return [];
            final list = jsonDecode(raw) as List;
            return list.map((e) => TermRule.fromJson(e as Map<String, dynamic>)).toList();
          }

          String encodeRules(List<TermRule> rules) =>
              jsonEncode(rules.map((e) => e.toJson()).toList());
          RULE_EOF

          cat > lib/services/epub_service.dart <<'EPUB_EOF'
          import 'dart:typed_data';
          import 'package:epubx/epubx.dart' as epub;
          import 'package:html/dom.dart' as dom;
          import 'package:html/parser.dart' as html_parser;
          import '../models/block.dart';

          class Chapter {
            final String title;
            final List<Block> blocks;
            Chapter(this.title, this.blocks);
          }

          class BookContent {
            final String title;
            final String author;
            final Uint8List? cover;
            final List<Chapter> chapters;
            BookContent(this.title, this.author, this.cover, this.chapters);
          }

          class EpubService {
            static Future<BookContent> parse(Uint8List bytes) async {
              final book = await epub.EpubReader.readBook(bytes);
              final chapters = <Chapter>[];

              void collect(List<epub.EpubChapter>? list) {
                for (final c in list ?? <epub.EpubChapter>[]) {
                  final html = c.HtmlContent;
                  if (html != null && html.trim().isNotEmpty) {
                    final blocks = _htmlToBlocks(html);
                    if (blocks.isNotEmpty) chapters.add(Chapter(c.Title ?? '', blocks));
                  }
                  collect(c.SubChapters);
                }
              }

              collect(book.Chapters);
              return BookContent(
                book.Title ?? 'Untitled',
                book.Author ?? 'Unknown',
                book.CoverImage?.Content,
                chapters,
              );
            }

            static const _blockTags = {
              'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
              'li', 'blockquote', 'pre'
            };
            static const _skipTags = {'script', 'style', 'head', 'nav', 'svg', 'noscript'};

            static List<Block> _htmlToBlocks(String html) {
              final doc = html_parser.parse(html).documentElement;
              final out = <Block>[];
              if (doc == null) return out;

              void walk(dom.Element el) {
                final tag = el.localName?.toLowerCase() ?? '';
                if (_skipTags.contains(tag)) return;
                if (_blockTags.contains(tag)) {
                  final text = _normalize(el.text);
                  if (text.isNotEmpty) out.add(Block(text, _typeOf(tag)));
                  return;
                }
                for (final child in el.children) walk(child);
              }

              walk(doc);
              return out;
            }

            static String _normalize(String s) =>
                s.replaceAll(RegExp(r'[\u00A0\s]+'), ' ').trim();

            static BlockType _typeOf(String tag) {
              if (tag.startsWith('h')) return BlockType.heading;
              if (tag == 'li') return BlockType.listItem;
              if (tag == 'blockquote') return BlockType.quote;
              return BlockType.paragraph;
            }
          }
          EPUB_EOF

          cat > lib/services/speech_controller.dart <<'SPEECH_EOF'
          import 'package:flutter/foundation.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import '../models/sentence.dart';
          import '../models/term_rule.dart';

          class SentenceRef {
            final int block;
            final Sentence sentence;
            const SentenceRef(this.block, this.sentence);
          }

          class SpeechController extends ChangeNotifier {
            final FlutterTts tts = FlutterTts();
            List<SentenceRef> _queue = [];
            int _index = -1;
            bool _cancelled = false;
            bool _ready = false;

            SentenceRef? get current =>
                (_index >= 0 && _index < _queue.length) ? _queue[_index] : null;
            bool get isSpeaking => _index >= 0;

            Future<void> _init() async {
              if (_ready) return;
              await tts.awaitSpeakCompletion(true);
              await tts.setSpeechRate(0.5);
              await tts.setPitch(1.0);
              _ready = true;
            }

            Future<void> speak(
                List<SentenceRef> queue, int start, List<TermRule> rules) async {
              await _init();
              await _cancel();
              _cancelled = false;
              _queue = queue;

              for (int i = start; i < queue.length; i++) {
                if (_cancelled) return;
                _index = i;
                notifyListeners();
                final text = applyTermRules(queue[i].sentence.text, rules);
                if (text.trim().isEmpty) continue;
                await tts.speak(text);
              }
              if (!_cancelled) {
                _index = -1;
                notifyListeners();
              }
            }

            Future<void> stop() async {
              await _cancel();
              _index = -1;
              notifyListeners();
            }

            Future<void> _cancel() async {
              _cancelled = true;
              try {
                await tts.stop();
              } catch (_) {}
            }

            @override
            void dispose() {
              tts.stop();
              super.dispose();
            }
          }
          SPEECH_EOF

          cat > lib/services/library_db.dart <<'DB_EOF'
          import 'dart:typed_data';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';
          import 'package:sqflite/sqflite.dart';

          class LibraryDB {
            static Database? _db;

            static Future<Database> _open() async {
              if (_db != null) return _db!;
              final dir = await getApplicationDocumentsDirectory();
              _db = await openDatabase(
                p.join(dir.path, 'library.db'),
                version: 1,
                onCreate: (db, _) => db.execute(
                  'CREATE TABLE books('
                  'id INTEGER PRIMARY KEY AUTOINCREMENT, '
                  'path TEXT UNIQUE, '
                  'title TEXT, '
                  'author TEXT, '
                  'cover BLOB)',
                ),
              );
              return _db!;
            }

            static Future<List<Map<String, dynamic>>> all() async {
              final db = await _open();
              return db.query('books', orderBy: 'id DESC');
            }

            static Future<void> insert(
                String path, String title, String author, Uint8List? cover) async {
              final db = await _open();
              await db.insert(
                'books',
                {'path': path, 'title': title, 'author': author, 'cover': cover},
                conflictAlgorithm: ConflictAlgorithm.replace,
              );
            }

            static Future<void> delete(int id) async {
              final db = await _open();
              await db.delete('books', where: 'id = ?', whereArgs: [id]);
            }
          }
          DB_EOF

          cat > lib/widgets/paragraph_view.dart <<'PARA_EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import '../models/block.dart';

          class ParagraphView extends StatefulWidget {
            final Block block;
            final int? highlightStart;
            final int? highlightEnd;
            final ValueChanged<int> onDoubleTapChar;
            final TextStyle style;

            const ParagraphView({
              super.key,
              required this.block,
              required this.onDoubleTapChar,
              required this.style,
              this.highlightStart,
              this.highlightEnd,
            });

            @override
            State<ParagraphView> createState() => _ParagraphViewState();
          }

          class _ParagraphViewState extends State<ParagraphView> {
            final _key = GlobalKey();

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                behavior: HitTestBehavior.opaque,
                onDoubleTapDown: (d) {
                  final ro = _key.currentContext?.findRenderObject();
                  if (ro is! RenderParagraph) return;
                  final pos = ro.getPositionForOffset(ro.globalToLocal(d.globalPosition));
                  widget.onDoubleTapChar(pos.offset);
                },
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                  child: RichText(
                    key: _key,
                    text: TextSpan(style: widget.style, children: _spans()),
                  ),
                ),
              );
            }

            List<TextSpan> _spans() {
              final t = widget.block.text;
              final s = widget.highlightStart;
              final e = widget.highlightEnd;
              if (s == null || e == null || s >= e || s >= t.length) {
                return [TextSpan(text: t)];
              }
              final end = e.clamp(0, t.length);
              return [
                if (s > 0) TextSpan(text: t.substring(0, s)),
                TextSpan(
                  text: t.substring(s, end),
                  style: const TextStyle(backgroundColor: Color(0x66FFC107)),
                ),
                if (end < t.length) TextSpan(text: t.substring(end)),
              ];
            }
          }
          PARA_EOF

          cat > lib/screens/library_screen.dart <<'LIB_EOF'
          import 'dart:io';
          import 'dart:typed_data';

          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';

          import '../services/epub_service.dart';
          import '../services/library_db.dart';
          import 'reader_screen.dart';

          class LibraryScreen extends StatefulWidget {
            const LibraryScreen({super.key});

            @override
            State<LibraryScreen> createState() => _LibraryScreenState();
          }

          class _LibraryScreenState extends State<LibraryScreen> {
            List<Map<String, dynamic>> _books = [];
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _refresh();
            }

            Future<void> _refresh() async {
              final books = await LibraryDB.all();
              if (!mounted) return;
              setState(() {
                _books = books;
                _loading = false;
              });
            }

            Future<void> _import() async {
              final res = await FilePicker.platform.pickFiles(
                type: FileType.custom,
                allowedExtensions: ['epub'],
              );
              if (res == null || res.files.isEmpty) return;
              final src = res.files.first.path;
              if (src == null) return;

              final bytes = await File(src).readAsBytes();
              final book = await EpubService.parse(bytes);
              final dir = await getApplicationDocumentsDirectory();
              final dest = p.join(
                  dir.path, 'book_${DateTime.now().millisecondsSinceEpoch}.epub');
              await File(dest).writeAsBytes(bytes);
              await LibraryDB.insert(dest, book.title, book.author, book.cover);
              await _refresh();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('T2S Reader')),
                body: _loading
                    ? const Center(child: CircularProgressIndicator())
                    : _books.isEmpty
                        ? const Center(child: Text('No books yet. Tap + to import an EPUB.'))
                        : ListView.separated(
                            itemCount: _books.length,
                            separatorBuilder: (_, __) => const Divider(height: 1),
                            itemBuilder: (_, i) {
                              final b = _books[i];
                              final cover = b['cover'] as Uint8List?;
                              return ListTile(
                                leading: SizedBox(
                                  width: 44,
                                  height: 60,
                                  child: cover != null
                                      ? Image.memory(cover, fit: BoxFit.cover)
                                      : const Icon(Icons.menu_book),
                                ),
                                title: Text(b['title'] ?? 'Untitled'),
                                subtitle: Text(b['author'] ?? ''),
                                onTap: () => Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => ReaderScreen(
                                      filePath: b['path'] as String,
                                      title: b['title'] as String? ?? 'Untitled',
                                    ),
                                  ),
                                ),
                                onLongPress: () async {
                                  await LibraryDB.delete(b['id'] as int);
                                  await _refresh();
                                },
                              );
                            },
                          ),
                floatingActionButton: FloatingActionButton(
                  onPressed: _import,
                  tooltip: 'Import EPUB',
                  child: const Icon(Icons.add),
                ),
              );
            }
          }
          LIB_EOF

          cat > lib/screens/reader_screen.dart <<'READ_EOF'
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import '../models/block.dart';
          import '../models/sentence.dart';
          import '../models/term_rule.dart';
          import '../services/epub_service.dart';
          import '../services/speech_controller.dart';
          import '../widgets/paragraph_view.dart';
          import 'terms_screen.dart';

          class ReaderScreen extends StatefulWidget {
            final String filePath;
            final String title;
            const ReaderScreen({super.key, required this.filePath, required this.title});

            @override
            State<ReaderScreen> createState() => _ReaderScreenState();
          }

          class _ReaderScreenState extends State<ReaderScreen> {
            final _speech = SpeechController();
            final _scroll = ScrollController();
            final Map<int, GlobalKey> _keys = {};

            BookContent? _book;
            int _chapter = 0;
            List<TermRule> _rules = [];
            String? _error;

            @override
            void initState() {
              super.initState();
              _speech.addListener(_onSpeechChanged);
              _load();
            }

            Future<void> _load() async {
              try {
                final bytes = await File(widget.filePath).readAsBytes();
                final book = await EpubService.parse(bytes);
                final prefs = await SharedPreferences.getInstance();
                _rules = decodeRules(prefs.getString('term_rules'));
                setState(() => _book = book);
              } catch (e) {
                setState(() => _error = e.toString());
              }
            }

            @override
            void dispose() {
              _speech.removeListener(_onSpeechChanged);
              _speech.dispose();
              _scroll.dispose();
              super.dispose();
            }

            void _onSpeechChanged() {
              final cur = _speech.current;
              if (cur != null) {
                final ctx = _keys[cur.block]?.currentContext;
                if (ctx != null) {
                  Scrollable.ensureVisible(
                    ctx,
                    duration: const Duration(milliseconds: 300),
                    alignment: 0.4,
                    curve: Curves.easeOut,
                  );
                }
              }
              setState(() {});
            }

            List<SentenceRef> _queueFor(List<Block> blocks) {
              final q = <SentenceRef>[];
              for (int b = 0; b < blocks.length; b++) {
                for (final s in splitSentences(blocks[b].text)) {
                  q.add(SentenceRef(b, s));
                }
              }
              return q;
            }

            void _onDoubleTap(int blockIdx, int charIdx) {
              final blocks = _book!.chapters[_chapter].blocks;
              final q = _queueFor(blocks);
              int target = 0;
              for (int i = 0; i < q.length; i++) {
                final r = q[i];
                if (r.block < blockIdx) {
                  target = i;
                  continue;
                }
                if (r.block > blockIdx) break;
                if (r.sentence.start <= charIdx) {
                  target = i;
                } else {
                  break;
                }
              }
              _speech.speak(q, target, _rules);
            }

            void _togglePlay() {
              if (_speech.isSpeaking) {
                _speech.stop();
              } else {
                final blocks = _book!.chapters[_chapter].blocks;
                _speech.speak(_queueFor(blocks), 0, _rules);
              }
            }

            Future<void> _openTerms() async {
              await Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => TermsScreen(rules: _rules)),
              );
              final prefs = await SharedPreferences.getInstance();
              setState(() => _rules = decodeRules(prefs.getString('term_rules')));
            }

            TextStyle _styleFor(BlockType t) {
              const base = TextStyle(fontSize: 18, height: 1.55);
              switch (t) {
                case BlockType.heading:
                  return base.copyWith(fontSize: 22, fontWeight: FontWeight.bold);
                case BlockType.quote:
                  return base.copyWith(fontStyle: FontStyle.italic);
                case BlockType.listItem:
                case BlockType.paragraph:
                  return base;
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(_book == null
                      ? widget.title
                      : _book!.chapters[_chapter].title.isEmpty
                          ? 'Chapter ${_chapter + 1}'
                          : _book!.chapters[_chapter].title),
                  actions: [
                    IconButton(
                      icon: Icon(_speech.isSpeaking ? Icons.stop : Icons.play_arrow),
                      onPressed: _book == null ? null : _togglePlay,
                    ),
                    IconButton(icon: const Icon(Icons.tune), onPressed: _openTerms),
                  ],
                ),
                drawer: _book == null
                    ? null
                    : Drawer(
                        child: ListView.builder(
                          itemCount: _book!.chapters.length,
                          itemBuilder: (_, i) => ListTile(
                            title: Text(
                              _book!.chapters[i].title.isEmpty
                                  ? 'Chapter ${i + 1}'
                                  : _book!.chapters[i].title,
                              maxLines: 2,
                              overflow: TextOverflow.ellipsis,
                            ),
                            selected: i == _chapter,
                            onTap: () {
                              _speech.stop();
                              _keys.clear();
                              setState(() => _chapter = i);
                              Navigator.pop(context);
                            },
                          ),
                        ),
                      ),
                body: _error != null
                    ? Center(child: Text(_error!))
                    : _book == null
                        ? const Center(child: CircularProgressIndicator())
                        : _buildReader(),
              );
            }

            Widget _buildReader() {
              final chapter = _book!.chapters[_chapter];
              final cur = _speech.current;
              return ListView.builder(
                controller: _scroll,
                padding: const EdgeInsets.only(top: 8, bottom: 160),
                itemCount: chapter.blocks.length,
                itemBuilder: (_, i) {
                  final block = chapter.blocks[i];
                  final key = _keys.putIfAbsent(i, () => GlobalKey());
                  int? hs, he;
                  if (cur != null && cur.block == i) {
                    hs = cur.sentence.start;
                    he = cur.sentence.end;
                  }
                  return ParagraphView(
                    key: key,
                    block: block,
                    highlightStart: hs,
                    highlightEnd: he,
                    onDoubleTapChar: (c) => _onDoubleTap(i, c),
                    style: _styleFor(block.type),
                  );
                },
              );
            }
          }
          READ_EOF

          cat > lib/screens/terms_screen.dart <<'TERMS_EOF'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import '../models/term_rule.dart';

          class TermsScreen extends StatefulWidget {
            final List<TermRule> rules;
            const TermsScreen({super.key, required this.rules});

            @override
            State<TermsScreen> createState() => _TermsScreenState();
          }

          class _TermsScreenState extends State<TermsScreen> {
            late List<TermRule> _rules;

            @override
            void initState() {
              super.initState();
              _rules = List.of(widget.rules);
            }

            Future<void> _save() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('term_rules', encodeRules(_rules));
            }

            Future<void> _addDialog() async {
              final find = TextEditingController();
              final replace = TextEditingController();
              bool regex = false;
              final result = await showDialog<TermRule>(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setLocal) => AlertDialog(
                    title: const Text('New replacement'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(
                          controller: find,
                          decoration: const InputDecoration(labelText: 'Find'),
                        ),
                        TextField(
                          controller: replace,
                          decoration: const InputDecoration(labelText: 'Replace with'),
                        ),
                        CheckboxListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Regex'),
                          value: regex,
                          onChanged: (v) => setLocal(() => regex = v ?? false),
                        ),
                      ],
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.pop(ctx),
                        child: const Text('Cancel'),
                      ),
                      TextButton(
                        onPressed: () {
                          if (find.text.isEmpty) return;
                          Navigator.pop(
                            ctx,
                            TermRule(
                              find: find.text,
                              replace: replace.text,
                              regex: regex,
                            ),
                          );
                        },
                        child: const Text('Add'),
                      ),
                    ],
                  ),
                ),
              );
              if (result != null) {
                setState(() => _rules.add(result));
                _save();
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Term replacement')),
                body: _rules.isEmpty
                    ? const Center(
                        child: Padding(
                          padding: EdgeInsets.all(24),
                          child: Text(
                            'Add pairs like "Dr." to "Doctor" or "&" to "and". '
                            'Only spoken text is replaced; the reading view stays unchanged.',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      )
                    : ListView.separated(
                        itemCount: _rules.length,
                        separatorBuilder: (_, __) => const Divider(height: 1),
                        itemBuilder: (_, i) {
                          final r = _rules[i];
                          return ListTile(
                            title: Text('${r.find}  ->  ${r.replace}'),
                            subtitle: Text(r.regex ? 'regex' : 'plain text'),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Switch(
                                  value: r.enabled,
                                  onChanged: (v) {
                                    setState(() => _rules[i] = r.copyWith(enabled: v));
                                    _save();
                                  },
                                ),
                                IconButton(
                                  icon: const Icon(Icons.delete_outline),
                                  onPressed: () {
                                    setState(() => _rules.removeAt(i));
                                    _save();
                                  },
                                ),
                              ],
                            ),
                          );
                        },
                      ),
                floatingActionButton: FloatingActionButton(
                  onPressed: _addDialog,
                  child: const Icon(Icons.add),
                ),
              );
            }
          }
          TERMS_EOF

          cat > README.md <<'README_EOF'
          # T2S Reader

          A text-to-speech EPUB reader for Android and iOS.

          ## Features
          - Imports EPUB 2 / EPUB 3 books
          - Uses the device's default system TTS voice
          - Double-tap any word to start speaking from that sentence
          - Continuous vertical scrolling with auto-follow while reading
          - Term replacement rules applied to spoken text (visible text unchanged)
          - Chapter drawer, cover thumbnails

          ## Run

          ```bash
          flutter pub get
          flutter run
          ```

          ## Layout

          ```
          lib/
            main.dart
            models/        Block, Sentence, TermRule
            services/      EPUB parser, TTS controller, library DB
            screens/       Library, Reader, Term replacement
            widgets/       ParagraphView (double-tap -> char index -> highlight)
          ```
          README_EOF

