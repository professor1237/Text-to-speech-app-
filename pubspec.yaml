name: t2s_reader
description: Text-to-speech reader for EPUB, PDF, TXT, DOCX, HTML and Markdown with system voice, term replacement, scroll reading.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
 webview_flutter: ^4.7.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  epubx: ^4.0.0
  html: ^0.15.4
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.0
  audio_service: ^0.18.18
  audio_session: ^0.1.21
  scrollable_positioned_list: ^0.3.8
  permission_handler: ^11.3.1
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdf: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
